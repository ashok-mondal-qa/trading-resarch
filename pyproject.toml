[project]
name = "trading-research"
version = "0.1.0"
description = "Paper-only research system for Indian equity swing trading"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
